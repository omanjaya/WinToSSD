name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Safety tests (Windows PowerShell 5.1)
        shell: powershell
        run: .\source\Tests.ps1

      - name: Publish self-contained EXE
        run: dotnet publish source/SSDInstaller.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -o publish

      - name: Verify embedded engine and write checksums
        shell: powershell
        run: |
          # The single-file bundle is compressed, so check the engine inside the app DLL that gets bundled.
          $enc = [Text.Encoding]::GetEncoding(28591)
          $dll = $enc.GetString([IO.File]::ReadAllBytes('source\bin\Release\net10.0-windows\win-x64\SSDInstaller.dll'))
          if (!$dll.Contains($enc.GetString([IO.File]::ReadAllBytes('source\Engine.ps1')))) { throw 'Engine.ps1 is not embedded unchanged' }
          $hash = (Get-FileHash publish\SSDInstaller.exe -Algorithm SHA256).Hash.ToLower()
          [IO.File]::WriteAllText("$PWD\publish\SHA256SUMS.txt", "$hash  SSDInstaller.exe`n")
          Copy-Item source\runtime-licenses\*.txt publish\
          Add-Content $env:GITHUB_STEP_SUMMARY "SSDInstaller.exe SHA-256: ``$hash``"

      - uses: actions/upload-artifact@v4
        with:
          name: SSDInstaller-${{ github.sha }}
          path: |
            publish/SSDInstaller.exe
            publish/SHA256SUMS.txt
            publish/*LICENSE*.txt
            publish/*NOTICES*.txt

      - name: Attach to GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          gh release view "$TAG" >/dev/null 2>&1 || gh release create "$TAG" --prerelease --title "WinToSSD $TAG" --generate-notes
          gh release upload "$TAG" publish/SSDInstaller.exe publish/SHA256SUMS.txt publish/DOTNET-LICENSE.txt publish/DOTNET-THIRD-PARTY-NOTICES.txt publish/WINDOWS-DESKTOP-LICENSE.txt --clobber
